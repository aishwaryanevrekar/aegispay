[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"
fs_permissions = [
    { access = "read-write", path = "./" },
]
remappings = []
# macOS/APFS network volumes create AppleDouble `._*` files; ignore them.
skip = ["**/._*"]

[rpc_endpoints]
# Fill these in with the Aevum testnet details from the starter kit / Discord.
aevum = "${AEVUM_RPC_URL}"

[etherscan]
# Aevum explorer (Etherscan-compatible) verification key, if available.
aevum = { key = "${EXPLORER_API_KEY}" }
